<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Whiteboard Alive</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Whiteboard Alive</h1>
        <p class="tagline">Draw it. Snap it. Watch it move.</p>
      </header>
      <label class="btn-primary">
        <input id="file" type="file" accept="image/*" hidden />
        Snap your drawing
      </label>
      <section class="examples" aria-labelledby="examples-head">
        <h2 id="examples-head">Or try one of ours</h2>
        <div id="examples" class="examples-row"></div>
      </section>
      <div id="status" class="status"></div>
      <div class="card">
        <canvas id="stage"></canvas>
        <button id="ai-toggle" class="btn-ghost btn-float" type="button" hidden>Show what AI saw</button>
      </div>
      <p id="explain" class="explain"></p>
      <section id="controls" class="controls" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/sw-register.ts"></script>
  </body>
</html>
